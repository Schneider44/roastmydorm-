<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Confirmed — RoastMyDorm</title>
    <link rel="icon" type="image/x-icon" href="roastmydorm_logo-removebg-preview.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            padding: 20px;
        }
        .card {
            max-width: 480px;
            background: #fff;
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 24px;
        }
        h1 { color: #065f46; font-size: 1.75rem; margin: 0 0 12px; }
        p { color: #4b5563; line-height: 1.6; margin: 8px 0; }
        .btn {
            display: inline-block;
            margin-top: 24px;
            background: #2563eb;
            color: #fff;
            padding: 12px 28px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn.secondary { background: transparent; color: #2563eb; border: 1px solid #2563eb; margin-left: 8px; }
        .btn.secondary:hover { background: #eff6ff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle"><i class="fas fa-check"></i></div>
        <h1>Subscription Confirmed!</h1>
        <p>Thank you — your Premium subscription is now active.</p>
        <p>You can publish unlimited listings, get the verified badge, and access analytics.</p>
        <p id="status-line" style="font-size:0.85rem;color:#9ca3af;margin-top:16px;"></p>
        <a href="/for-landlords.html#premium-card" class="btn">Submit a Property</a>
        <a href="/index.html" class="btn secondary">Back to Home</a>
    </div>
    <script>
        (function() {
            const API_BASE = (['localhost', '127.0.0.1', ''].includes(location.hostname))
                ? 'http://localhost:5000'
                : 'https://roastmydorm-backend-zy4p.vercel.app';

            const token = localStorage.getItem('token');
            if (!token) return;

            // Confirm subscription status from backend (webhook may take a few seconds)
            const tryFetch = async (attempt = 0) => {
                try {
                    const res = await fetch(`${API_BASE}/api/stripe/status`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (data && data.success && data.data && (data.data.status === 'active' || data.data.status === 'trialing')) {
                        document.getElementById('status-line').textContent =
                            'Status: Active' + (data.data.currentPeriodEnd
                                ? ` · renews ${new Date(data.data.currentPeriodEnd).toLocaleDateString()}`
                                : '');
                        return;
                    }
                } catch (_) {}
                // Webhook may take a moment — retry up to 3 times
                if (attempt < 3) setTimeout(() => tryFetch(attempt + 1), 2500);
            };
            tryFetch();
        })();
    </script>
</body>
</html>
