<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Canceled — RoastMyDorm</title>
    <link rel="icon" type="image/x-icon" href="roastmydorm_logo-removebg-preview.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            padding: 20px;
        }
        .card {
            max-width: 480px;
            background: #fff;
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fef3c7;
            color: #d97706;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 24px;
        }
        h1 { color: #92400e; font-size: 1.75rem; margin: 0 0 12px; }
        p { color: #4b5563; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 24px;
            background: #2563eb;
            color: #fff;
            padding: 12px 28px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle"><i class="fas fa-times"></i></div>
        <h1>Checkout Canceled</h1>
        <p>No charge was made. You can subscribe whenever you're ready.</p>
        <a href="/for-landlords.html#premium-card" class="btn">Try Again</a>
    </div>
</body>
</html>
